spring:
  application:
    name: notification-service

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:your-email@gmail.com}
    password: ${SMTP_PASS:your-app-password}
    from: ${SMTP_FROM:noreply@pos-system.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.notification: DEBUG
