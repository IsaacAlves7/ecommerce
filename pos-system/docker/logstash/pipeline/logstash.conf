input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  if [service] {
    mutate {
      add_tag => ["pos-system"]
    }
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "pos-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
